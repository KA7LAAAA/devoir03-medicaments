<div class="container mt-4">
  <div>
    <h2>{{ modeModification ? "Modifier un Médicament :" : "Ajouter un Médicament :" }}</h2>
  </div>

  <form (ngSubmit)="enregistrer()">
    <div class="col-sm-2 col-md-2 col-lg-2 mb-2">
      <label>ID Médicament</label>
      <input type="text" [(ngModel)]="newMedicament.id" name="id" class="form-control" readonly>
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4 mb-2">
      <label>Nom Médicament</label>
      <input type="text" [(ngModel)]="newMedicament.nom" name="nom" class="form-control" required placeholder="Nom du médicament">
    </div>

    <div class="col-sm-2 col-md-2 col-lg-2 mb-2">
      <label>Prix (millimes)</label>
      <input type="number" [(ngModel)]="newMedicament.prixMillimes" name="prixMillimes" class="form-control" placeholder="ex: 2500">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4 mb-2">
      <label>Date d'expiration</label>
      <input type="date" [(ngModel)]="dateStr" name="dateExpiration" class="form-control" required>
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4 mb-2">
      <label>Catégorie</label>
      <select class="form-control form-control-lg" name="categorie" [(ngModel)]="newMedicament.categorie">
        @for (c of tab_categorie; track c) {
          <option [value]="c">{{ c }}</option>
        }
      </select>
    </div>

    <div class="col-sm-2 col-md-2 col-lg-2 mb-2">
      <label>Stock</label>
      <input type="number" [(ngModel)]="newMedicament.stock" name="stock" class="form-control" placeholder="ex: 100">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4 mb-3">
      <div class="form-check mt-2">
        <input type="checkbox" class="form-check-input" id="ordonnance" [(ngModel)]="newMedicament.ordonnance" name="ordonnance">
        <label class="form-check-label" for="ordonnance">Ordonnance obligatoire</label>
      </div>
    </div>

    <div class="mt-2">
      <button type="submit" class="btn btn-success me-2">
        {{ modeModification ? "Modifier" : "Ajouter" }}
      </button>
      <button type="button" class="btn btn-secondary" (click)="annuler()">
        Annuler
      </button>
    </div>
  </form>
</div>
